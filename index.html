  <body>
    <script>
      // Restaura la ruta guardada por 404.html (SPA fallback de GitHub Pages)
      (function () {
        var p = new URLSearchParams(window.location.search);
        var route = p.get('p');
        if (route) {
          var q = p.get('q');
          // base path actual (p.ej. /la-senda-erp), sin la barra final
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(
            null,
            '',
            base + route + (q ? '?' + q : '') + window.location.hash
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
